<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería con Grid</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <div class="galeria">
        <img src="https://picsum.photos/id/237/200/300" alt="foto 1">
        <img src="https://picsum.photos/seed/picsum/200/300" alt="foto 2">
        <img src="https://picsum.photos/200/300?grayscale" alt="foto 3">
        <img src="https://picsum.photos/200/300/?blur" alt="foto 4">
        <img src="https://picsum.photos/200/300/?blur=2" alt="foto 5">
        <img src="https://picsum.photos/id/870/200/300?grayscale&blur=2" alt="foto 6">
    </div>
</body>
</html>
