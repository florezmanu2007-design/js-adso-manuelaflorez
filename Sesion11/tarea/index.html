<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validador de Contraseña</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>Crear nueva contraseña</h1>

    <form id="formPassword" novalidate>
      <div class="campo">
        <label for="password">Contraseña nueva</label>
        <input type="password" id="password" autocomplete="new-password" placeholder="Escribe tu contraseña..." />
      </div>

      <div class="campo">
        <label for="confirmar">Confirmar contraseña</label>
        <input type="password" id="confirmar" autocomplete="new-password" placeholder="Repite tu contraseña..." />
        <small id="mensajeCoincidencia" class="mensaje"></small>
      </div>

      <!-- Barra y texto de fortaleza (Punto 3) -->
      <div class="fortaleza-box">
        <div class="barra-fondo">
          <div id="barraProgreso" class="barra-progreso"></div>
        </div>
        <span id="textoFortaleza">Fortaleza: Débil</span>
      </div>

      <!-- Lista de 5 requisitos (Punto 2) -->
      <ul id="listaRequisitos" class="requisitos">
        <li id="req-longitud">❌ Al menos 8 caracteres</li>
        <li id="req-mayuscula">❌ Al menos una mayúscula (A-Z)</li>
        <li id="req-minuscula">❌ Al menos una minúscula (a-z)</li>
        <li id="req-numero">❌ Al menos un número (0-9)</li>
        <li id="req-simbolo">❌ Al menos un símbolo (!@#$...)</li>
      </ul>

      <button type="submit" id="btnGuardar" disabled>Guardar contraseña</button>
    </form>
  </main>

  <script src="main.js"></script>
</body>
</html>
